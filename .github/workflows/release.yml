name: Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Tag & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nécessaire au calcul du tag (historique complet)

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Calcule le prochain tag SemVer à partir des Conventional Commits
      # (feat: -> minor, fix: -> patch, BREAKING CHANGE / ! -> major).
      - name: Bump version and push tag
        id: bump_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      # Reconstitue le keystore de release à partir du secret base64. Le
      # fichier n'existe que sur ce runner éphémère, jamais dans le dépôt.
      - name: Decode release keystore
        if: ${{ steps.bump_version.outputs.new_version != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/delivr-release.jks"

      - name: Build signed release APK
        if: ${{ steps.bump_version.outputs.new_version != '' }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/delivr-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${{ steps.bump_version.outputs.new_version }}"
          ./gradlew assembleRelease \
            -PdelivrVersionName="$VERSION" \
            -PdelivrVersionCode="${{ github.run_number }}"

      - name: Rename APK
        if: ${{ steps.bump_version.outputs.new_version != '' }}
        run: |
          VERSION="${{ steps.bump_version.outputs.new_version }}"
          cp app/build/outputs/apk/release/app-release.apk "delivr_v${VERSION}.apk"

      - name: Create GitHub Release
        if: ${{ steps.bump_version.outputs.new_version != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump_version.outputs.new_version }}
          name: Delivr v${{ steps.bump_version.outputs.new_version }}
          body: |
            ## Quoi de neuf dans cette version (v${{ steps.bump_version.outputs.new_version }})

            ${{ steps.bump_version.outputs.changelog }}
          files: delivr_v${{ steps.bump_version.outputs.new_version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md
        if: ${{ steps.bump_version.outputs.new_version != '' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          VERSION="v${{ steps.bump_version.outputs.new_version }}"
          DATE=$(date +'%Y-%m-%d')
          CHANGELOG_CONTENT="${{ steps.bump_version.outputs.changelog }}"

          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog - Delivr" > CHANGELOG.md
            echo "Toutes les modifications notables de cette application sont consignées ici." >> CHANGELOG.md
          fi

          echo -e "\n## [$VERSION] - $DATE\n$CHANGELOG_CONTENT" > temp_changelog.md
          cat CHANGELOG.md >> temp_changelog.md
          mv temp_changelog.md CHANGELOG.md

          git add CHANGELOG.md
          git commit -m "chore(release): mise à jour du CHANGELOG.md pour $VERSION [skip ci]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
