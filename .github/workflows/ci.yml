name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run lint
        run: ./gradlew lint

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Sans cette étape, le premier build minifié de chaque version serait
      # celui publié par release.yml : une règle R8 manquante ne se verrait
      # qu'en production. Ici la release est construite non signée (aucun
      # keystore en CI, voir app/build.gradle.kts) — seul le passage de R8
      # nous intéresse.
      - name: Build release APK (vérifie R8 / shrinkResources)
        run: ./gradlew assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: delivr-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
